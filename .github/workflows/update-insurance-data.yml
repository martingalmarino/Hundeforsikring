name: Update Insurance Data

on:
  schedule:
    # Run every 2 months on the 1st at 9:00 AM UTC
    - cron: '0 9 1 */2 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install jsdom
        
    - name: Create logs directory
      run: mkdir -p logs
      
    - name: Run scraping script
      run: |
        node scripts/scrape-insurance-data.js
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/hundeforsikring.json
        git add logs/
        git commit -m "🤖 Auto-update: Insurance data refreshed $(date '+%Y-%m-%d')"
        git push
        
    - name: Create deployment
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        echo "Data updated successfully! Vercel will automatically deploy the changes."
        
    - name: No changes notification
      if: steps.verify-changed-files.outputs.changed == 'false'
      run: |
        echo "No changes detected in insurance data."
